name: 🔄 Update MIMIT Data

on:
  schedule:
    # Runs every day at 9:00 AM Rome time (7:00 UTC in summer, 8:00 UTC in winter)
    # Using 7:00 UTC to cover daylight saving time (CEST)
    - cron: '0 7 * * *'
  
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required for auto-commit
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🔄 Update MIMIT data
      run: |
        python update_mimit_data.py
        
    - name: 📊 Check if data changed
      id: check_changes
      run: |
        if git diff --quiet data.js; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No changes detected in data.js"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Changes detected in data.js"
        fi
        
    - name: 💾 Commit and push changes
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.js
        git commit -m "🔄 Auto-update MIMIT data - $(date +'%Y-%m-%d %H:%M UTC')"
        git push
        
    - name: ✅ Report success
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        echo "✅ Data successfully updated and pushed!"
        echo "🌐 GitHub Pages will automatically deploy the updated data"
        
    - name: ℹ️ No update needed
      if: steps.check_changes.outputs.changed == 'false'
      run: |
        echo "ℹ️ No changes in MIMIT data - no update needed"